# Real client IP: Cloudflare sets CF-Connecting-IP (traffic arrives via cloudflared).
# On the LAN (no Cloudflare) fall back to the socket address.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# First throttle, before anything reaches the login gateway (in memory, no DB).
limit_req_zone $client_ip zone=login_ip:10m rate=10r/m;
limit_req_zone $client_ip zone=session_ip:10m rate=30r/m;
limit_req_zone $client_ip zone=report_ip:10m rate=6r/m;
limit_req_status 429;
log_format offshore '$client_ip [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /srv/web/dist;
    server_tokens off;
    access_log /var/log/nginx/access.log offshore;
    client_max_body_size 4k;

    # Private tool: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Login gateway (services/auth-gateway). Login never goes to the database directly.
    location = /api/login {
        limit_req zone=login_ip burst=5 nodelay;
        proxy_pass http://auth:8080;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location ~ ^/api/(refresh|logout)$ {
        limit_req zone=session_ip burst=10 nodelay;
        proxy_pass http://auth:8080;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    # User management (admin only; the gateway verifies the token and the admin flag).
    location ~ "^/api/admin/users(/[0-9a-f-]{36})?$" {
        limit_req zone=session_ip burst=20 nodelay;
        client_max_body_size 8k;
        proxy_pass http://auth:8080;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    # Emailed reports: the report (HTML + Excel, base64) is a few hundred kB, so this is the one place a big body is allowed.
    # The gateway checks the token, picks the recipient, caps the size again and rate-limits per user; n8n renders and sends.
    location = /api/report/email {
        limit_req zone=report_ip burst=3 nodelay;
        client_max_body_size 8m;
        proxy_pass http://auth:8080;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 100s;
    }
    location = /api/health { proxy_pass http://auth:8080; access_log off; }
    location /api/ { return 404; }

    # Hashed build assets can be cached forever; everything else is revalidated.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
