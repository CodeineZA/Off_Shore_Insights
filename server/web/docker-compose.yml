# Off_Shore_Insights: static site + login gateway. Deployed by the n8n
# "Off_Shore_Insights - Git_sync" workflow; `--restart` in a commit message recreates both.
# Until the frontend exists (it waits for the designs) the site serves ./placeholder.
# When apps/web lands, point the html mount at ../../apps/web/dist.
# ./.env (gitignored) is written by scripts/deploy.sh from the shared Supabase master.
name: offshore-insights
services:
  web:
    image: nginx:alpine
    container_name: offshore-insights-web
    restart: unless-stopped
    ports:
      - "8094:80"
    volumes:
      - ../../apps/web:/srv/web:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth

  auth:
    image: node:22-alpine
    container_name: offshore-insights-auth
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    working_dir: /app
    volumes:
      - ../../services/auth-gateway:/app:ro
    env_file: .env
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:8000
      SUPABASE_SCHEMA: offshore_insights
      AUTH_USERNAME_DOMAIN: users.insights.codeine.cloud
      # n8n workflow R1 renders an emailed report to PDF and sends it. Its shared secret (REPORT_WEBHOOK_SECRET) comes from ./.env.
      REPORT_WEBHOOK_URL: http://host.docker.internal:5678/webhook/offshore-report-mail
      PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Not published on the host: only nginx reaches it.
